name: Apply random question order

on:
  push:
    branches:
      - feat/random-question-order

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Update quiz start order
        shell: python
        run: |
          from pathlib import Path

          path = Path("python_oops_quiz.html")
          text = path.read_text(encoding="utf-8")
          old = 'function startQuiz() { state.questions = SECTION_CONFIG[state.section].questions; resetState(); showScreen("quiz"); renderQuestion(); }'
          new = '''function shuffleQuestions(questions) {
            const shuffled = [...questions];
            for (let i = shuffled.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
          }
          function startQuiz() { state.questions = shuffleQuestions(SECTION_CONFIG[state.section].questions); resetState(); showScreen("quiz"); renderQuestion(); }'''

          if old not in text:
              raise SystemExit("Expected startQuiz implementation was not found")
          if "function shuffleQuestions(questions)" in text:
              raise SystemExit("Random question ordering is already implemented")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit quiz change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python_oops_quiz.html
          git commit -m "Randomize question order on quiz start"
          git rm .github/workflows/apply-random-question-order.yml
          git commit -m "Remove temporary change workflow"
          git push origin HEAD:feat/random-question-order
